plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.faceclean.wasuporte'
    compileSdk 34

    defaultConfig {
        applicationId "com.faceclean.wasuporte"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        fixa {
            storeFile file('wasuporte.jks')
            storePassword 'wabridgefc'
            keyAlias 'wabridge'
            keyPassword 'wabridgefc'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.fixa
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixa
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
